name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libpixman-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: 单元测试 + e2e（headless，无 GPU 依赖）
        run: cargo test --workspace -- --test-threads=1
      - name: Clippy（不设门槛，问题见 issue）
        run: cargo clippy --workspace
