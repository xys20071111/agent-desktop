[workspace]
resolver = "2"
members = [
    "crates/ad-ipc",
    "crates/ad-wm",
    "crates/agentdesk",
    "crates/adctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
calloop = "0.14"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
pixman = "0.2"
smithay = { version = "=0.7.0", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "renderer_glow",
    "renderer_pixman",
    "backend_egl",
] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = [
    "calloop",
    "xkbcommon",
] }
xkbcommon = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
